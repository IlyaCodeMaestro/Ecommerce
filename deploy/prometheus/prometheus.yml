global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: "ecommerce-api"
    static_configs:
      - targets: ["backend-api:8080"]
    metrics_path: "/metrics"

  - job_name: "ecommerce-worker"
    static_configs:
      - targets: ["backend-worker:8081"]
    metrics_path: "/metrics"
