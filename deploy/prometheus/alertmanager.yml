global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'tier']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: 'default-webhook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 15m

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'tier']

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://backend-api:8080/api/v1/internal/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://backend-api:8080/api/v1/internal/alerts/critical'
        send_resolved: true
