apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
  namespace: ecommerce
  labels:
    app: backend-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-worker
  template:
    metadata:
      labels:
        app: backend-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: worker
          image: ghcr.io/ilyacodemaestro/ecommerce/worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8081"
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres.ecommerce.svc.cluster.local:5432/ecommerce?sslmode=disable"
            - name: REDIS_ADDR
              value: "redis.ecommerce.svc.cluster.local:6379"
            - name: KAFKA_BROKERS
              value: "redpanda.ecommerce.svc.cluster.local:29092"
            - name: KAFKA_TOPIC
              value: "orders.created"
            - name: KAFKA_GROUP_ID
              value: "order-batch-persist-group"
          ports:
            - containerPort: 8081
              name: metrics
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-worker
  namespace: ecommerce
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      name: metrics
  selector:
    app: backend-worker
