name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # CI: Continuous Integration (Lint, Test, Security & Build Verification)
  # =========================================================================

  backend-ci:
    name: Backend Test & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: backend/go.sum

      - name: Verify Go Modules
        working-directory: backend
        run: go mod verify

      - name: Run Go Vet
        working-directory: backend
        run: go vet ./...

      - name: Run Unit & Concurrency Tests
        working-directory: backend
        run: go test -v -race -cover ./...

      - name: Verify Binary Compilation
        working-directory: backend
        run: |
          CGO_ENABLED=0 go build -o /dev/null ./cmd/api
          CGO_ENABLED=0 go build -o /dev/null ./cmd/worker

  frontend-ci:
    name: Frontend Test & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Production Vite Bundle
        working-directory: frontend
        run: npm run build

  compose-validation:
    name: Docker Infrastructure Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        working-directory: deploy
        run: docker compose config

  # =========================================================================
  # CD: Continuous Delivery (Build & Publish Production Docker Images to GHCR)
  # Runs ONLY on push to 'main' when all CI checks pass
  # =========================================================================

  backend-cd:
    name: Publish Production Images to GHCR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [compose-validation]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract metadata for Worker image
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/worker
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Backend Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
